<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <Form>

        <fieldset>
            <legend>Personal Details</legend>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" placeholder="Enter yourname">
            <br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="you@email.com">
            <br>
            <label for="pwd">Password:</label>
            <input type="password" name="pwd" id="pwd" placeholder="Enter password">
            <br>
            <label for="age">Age</label>
            <input type="number" name="age" id="age" min="1" max="100">
            <br>
            <label for="dob">Date of Birth</label>
            <input type="date" name="dob" id="dob">
            <br>
            <label for="login">Login Time:</label>
            <input type="time" name="logintime" id="login">
            <br>
            <label for="file">Upload Resume:</label>
            <br>
            <input type="file" name="resume" id="file" accept=".pdf, .doc">
            <br>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>
            <br>
            <label for="country">Country:</label>
            <select name="country" id="country">
                <option value="india" selected>India</option>
                <option value="uk">UK</option>
                <option value="usa">USA</option>
            </select>
            <br>
            <button type="reset">Reset</button>
            <br>
            
            <input list="browsers" name="browser">
            <datalist id="browsers">
                <option value="Chrome">
                <option value="Firefox">
                <option value="Edge">
            </datalist>

        </fieldset>

    </Form>
</body>

</html>
